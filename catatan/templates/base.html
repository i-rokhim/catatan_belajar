{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>{% block judul %}Catatan Belajar Coding{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'catatan/style.css' %}">
</head>
<body>
    {% block isi %}{% endblock %}
    {% if user.is_authenticated %}
    <form action="{% url 'logout' %}" method="post" style="display: inline;">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
{% endif %}
</body>
</html>
