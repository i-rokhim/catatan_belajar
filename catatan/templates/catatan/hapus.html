{% extends 'base.html' %}

{% block judul %}Hapus Catatan{% endblock %}

{% block isi %}
    <h1>Hapus Catatan</h1>
    <p>Yakin ingin menghapus "{{ catatan.judul }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Ya, hapus</button>
    </form>
    <a href="{% url 'daftar_catatan' %}">Batal</a>
{% endblock %}
