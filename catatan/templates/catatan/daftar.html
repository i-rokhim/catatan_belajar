<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Catatan Belajar Coding</title>
</head>
<body>
    <h1>Catatan Belajar Coding</h1>
    <a href="{% url 'tambah_catatan' %}">Tambah catatan</a>
    {% for c in semua %}
        <h2>{{ c.judul }}</h2>
        <p>{{ c.kategori }} · {{ c.tanggal|date:"d M Y" }}</p>
        <p>{{ c.isi }}</p>
        <a href="{% url 'edit_catatan' c.pk %}">Edit</a>
        <a href="{% url 'hapus_catatan' c.pk %}">Hapus</a>
    {% empty %}
        <p>Belum ada catatan.</p>
    {% endfor %}
</body>
</html>
